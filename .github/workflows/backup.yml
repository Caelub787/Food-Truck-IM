name: Weekly backup

# Every Sunday night, saves a copy of the database (structure and data) as a
# download on this workflow run, kept for 30 days. The copy is locked with
# BACKUP_PASSPHRASE, so nobody else can read it even if they can see the
# download. Needs the Supabase secrets from docs/SETUP.md plus BACKUP_PASSPHRASE.
# To open a backup: gpg --decrypt backup.tar.gz.gpg > backup.tar.gz
on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check the secrets are set
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "Backup secrets are not set yet (see docs/SETUP.md). Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: latest
      - name: Dump the database
        if: steps.check.outputs.ready == 'true'
        run: |
          supabase link --project-ref "$PROJECT_REF"
          mkdir backup
          supabase db dump -f backup/schema.sql
          supabase db dump --data-only -f backup/data.sql
          tar czf backup.tar.gz backup
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 -o backup.tar.gz.gpg backup.tar.gz
          rm -rf backup backup.tar.gz
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.ready == 'true'
        with:
          name: backup-${{ github.run_id }}
          path: backup.tar.gz.gpg
          retention-days: 30
